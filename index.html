<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Czytelny plan lekcji klasy 2ap z podziałem na grupy." />
  <meta name="theme-color" content="#f2f2ef" />
  <title>Plan lekcji 2ap</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%233b5bff'/%3E%3Cpath d='M16 20h32M16 32h24M16 44h18' fill='none' stroke='white' stroke-width='6'/%3E%3C/svg%3E" />
  <script>
    (() => {
      const saved = localStorage.getItem("timetable-theme");
      document.documentElement.dataset.theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Plan lekcji klasy 2ap">
        <span class="brand-mark" aria-hidden="true">2A</span>
        <span class="brand-copy"><strong>PLAN LEKCJI</strong><small>Klasa 2ap</small></span>
      </a>
      <button class="icon-button" id="themeButton" type="button" aria-label="Zmień motyw" title="Zmień motyw">
        <span aria-hidden="true" id="themeIcon">◐</span>
      </button>
    </header>

    <main>
      <section class="status-card" aria-live="polite">
        <div class="status-copy">
          <p class="eyebrow" id="todayLabel">DZISIAJ</p>
          <h1 id="statusTitle">Sprawdzam plan…</h1>
          <p id="statusDetail">Chwila.</p>
        </div>
        <time class="clock" id="clock">--:--</time>
      </section>

      <section class="controls" aria-label="Ustawienia planu">
        <div class="group-switch" role="group" aria-label="Wybierz grupę">
          <button type="button" data-group="1" aria-pressed="true">Grupa 1</button>
          <button type="button" data-group="2" aria-pressed="false">Grupa 2</button>
        </div>
        <button class="today-button" id="todayButton" type="button">Przejdź do dzisiaj</button>
      </section>

      <nav class="day-tabs" id="dayTabs" aria-label="Wybierz dzień tygodnia"></nav>

      <section class="schedule-head">
        <div>
          <p class="eyebrow">PLAN TYGODNIA</p>
          <h2 id="dayHeading">Poniedziałek</h2>
        </div>
        <p class="lesson-count" id="lessonCount"></p>
      </section>

      <section class="timeline" id="timeline" aria-label="Lekcje"></section>
    </main>

    <footer>Plan dla klasy 2ap <span aria-hidden="true">·</span> godziny według czasu polskiego</footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
